<form method="GET" class="search-form">
    <div class="input-group">
        <input
            type="text"
            name="q"
            placeholder="{{ search_placeholder|default:'Search...' }}"
            value="{{ request.GET.q }}"
            class="search-input"
        >
        <button type="submit" class="btn btn-outline search-btn">
            Search
        </button>
    </div>
</form>
