{% if is_paginated %}
<div class="pagination-wrapper">
    <div class="pagination">
        {% if page_obj.has_previous %}
            <a href="?q={{ request.GET.q }}&page=1" class="page-link">&laquo; First</a>
            <a href="?q={{ request.GET.q }}&page={{ page_obj.previous_page_number }}" class="page-link">Previous</a>
        {% endif %}

        <span class="page-info">
            Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}
        </span>

        {% if page_obj.has_next %}
            <a href="?q={{ request.GET.q }}&page={{ page_obj.next_page_number }}" class="page-link">Next</a>
            <a href="?q={{ request.GET.q }}&page={{ page_obj.paginator.num_pages }}" class="page-link">Last &raquo;</a>
        {% endif %}
    </div>
</div>
{% endif %}
